name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'playground/**'
      - 'src/**'
      - 'moon.mod'
      - 'moon.pkg'
      - 'moonmel.mbt'
      - 'tools/build/**'
      - 'tools/quality/check-toolchain.mjs'
      - 'tools/reference/parity_report.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v5
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh -o /tmp/install-moonbit.sh
          bash /tmp/install-moonbit.sh
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.14.0'
      - name: Install dependencies
        run: pnpm --dir playground install --frozen-lockfile
      - name: Build fresh MoonBit bindings and Pages assets
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
        run: pnpm --dir playground run build --base "$PAGES_BASE_PATH"
      - name: Verify browser bindings
        run: pnpm --dir playground test
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: playground/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
